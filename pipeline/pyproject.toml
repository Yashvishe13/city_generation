[project]
name = "osm2pcg"
version = "0.1.0"
description = "OpenStreetMap -> Unreal Engine PCG translation pipeline"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "shapely>=2.0",
    "pyproj>=3.6",
]

[project.scripts]
osm2pcg = "osm2pcg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["osm2pcg"]
